name: Docker Build Check

on:
  push:
    branches: [ main, master ]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'solution.py'
      - '.github/workflows/docker-build.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'Dockerfile'
      - 'requirements.txt'
      - 'solution.py'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false                    # только проверяем сборку
          tags: test-image:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true                     # загружаем образ в Docker для дальнейших проверок

      - name: Test container
        run: |
          docker run --rm test-image:latest python3.10 -c "
          import torch
          print('Torch version:', torch.__version__)
          print('CUDA available:', torch.cuda.is_available())
          import unsloth
          print('Unsloth imported successfully')
          "

      - name: Check image size (опционально)
        run: |
          SIZE=$(docker images test-image:latest --format "{{.Size}}")
          echo "Image size: $SIZE"
          # Можно добавить проверку на максимальный размер